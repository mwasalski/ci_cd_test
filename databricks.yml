# Databricks Asset Bundle root.
#
# Target: Databricks Free Edition, which is SERVERLESS-ONLY. There is no
# `new_cluster` anywhere in this bundle and there cannot be one -- Free Edition
# grants no cluster-creation capability, so a job that asks for a node type or a
# spark_version fails at deploy time, not at run time. Every task runs on a
# serverless environment (environment version 5).
#
# Deploy:   databricks bundle deploy -t dev
# Run:      databricks bundle run unit_tests -t dev
#           databricks bundle run collections_pipeline -t dev
#           databricks bundle run smoke_test -t dev
#
# The whole point of DABs: the job definition is code, reviewed in a PR,
# and dev/prod differ only by variable values -- not by a hand-edited job in the UI.

bundle:
  name: collections_platform

include:
  - resources/*.yml

# The CLI builds the wheel itself during `bundle deploy`, so the artifact can
# never be stale relative to the code being deployed. Building it by hand in a
# separate step is how you deploy last week's wheel and spend an hour wondering
# why your fix did not take effect.
artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: dev_collections
  bronze_schema:
    description: >-
      Home of the landing volume. The raw files in that volume ARE the bronze
      layer -- there is no bronze *table*, because a copy of a CSV in Delta with
      no types and no DQ applied buys nothing but storage.
    default: bronze
  silver_schema:
    description: Conformed, typed, deduplicated, DQ-checked. Reference data too.
    default: silver
  gold_schema:
    default: gold
  ops_schema:
    description: Quarantine, DQ metrics, run audit. Not analyst-facing.
    default: ops
  landing_path:
    description: Volume path where raw originator portfolio files land.
    default: /Volumes/dev_collections/bronze/landing
  pii_secret_scope:
    description: Secret scope holding the pseudonymisation pepper.
    default: collections

  # -------------------------------------------------------------------------
  # Serverless
  # -------------------------------------------------------------------------
  environment_version:
    description: >-
      Serverless environment version. 5 = Databricks Connect 18 / Spark 4 /
      Python 3.12, and it is what pyproject.toml's [tool.databricks.environment]
      pins for the local loop. Change it in both places or in neither -- the
      point of running the tests on serverless is that they run on the same
      thing the jobs do.
    default: "5"

  # -------------------------------------------------------------------------
  # The one principal
  #
  # Free Edition has no account console: no account groups, no service
  # principals, one human per account. So everywhere a real workspace would name
  # a group (`data-analysts`) or an SP (`sp-collections-platform`) -- run_as, job
  # permissions, grants, the mask predicates in sql/uc_governance.sql -- this
  # bundle names one user instead.
  #
  # The consequence worth stating out loud: on a single-principal workspace the
  # masks and the row filter are no-ops FOR THAT USER. The mechanism is real and
  # attached to the columns; there is simply nobody else to hide the data from.
  # -------------------------------------------------------------------------
  platform_user:
    description: Owns, deploys, runs and reads everything on this workspace.
    default: moustache.data@gmail.com

targets:
  dev:
    mode: development # prefixes resources with [dev <user>], pauses schedules
    default: true
    workspace:
      host: https://dbc-2b69cffc-7563.cloud.databricks.com/
    run_as:
      # Every job runs as this user. In `mode: development` the CLI only accepts
      # the deploying user here anyway, which is the point: it makes "who ran
      # this" explicit in the file instead of implicit in whoever last typed
      # `bundle deploy`.
      user_name: ${var.platform_user}
    permissions:
      - level: CAN_MANAGE
        user_name: ${var.platform_user}
    variables:
      catalog: dev_collections
      landing_path: /Volumes/dev_collections/bronze/landing

  prod:
    # Kept deliberately: "dev and prod differ only by variable values" is the
    # claim a DAB exists to make. Here that is literally true -- the catalog and
    # the landing path, nothing else.
    #
    # What a paid workspace would change, and this one cannot: run_as would be a
    # service principal (it survives people leaving), permissions would name
    # groups, and the mask predicates would ask about group membership rather
    # than about one username.
    mode: production # blocks deploy if the git tree is dirty
    workspace:
      host: https://dbc-2b69cffc-7563.cloud.databricks.com/
      # Under the user's own home, not /Workspace/Shared: on this workspace
      # /Shared is writable by every user, which `bundle validate` rightly
      # complains about for a production target.
      root_path: /Workspace/Users/${var.platform_user}/.bundle/prod/${bundle.name}
    run_as:
      user_name: ${var.platform_user}
    permissions:
      - level: CAN_MANAGE
        user_name: ${var.platform_user}
    variables:
      catalog: prod_collections
      landing_path: /Volumes/prod_collections/bronze/landing
