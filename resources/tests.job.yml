resources:
  jobs:
    # ---------------------------------------------------------------------
    # bootstrap: creates schemas, the landing volume and the reference tables.
    # Run ONCE, before anything else, on a fresh target.
    #
    # Not part of collections_pipeline on purpose. DDL on every pipeline run
    # means the pipeline's service principal needs CREATE privileges forever,
    # and it hides "the schema did not exist" behind "the job succeeded".
    # ---------------------------------------------------------------------
    bootstrap:
      name: "[${bundle.target}] bootstrap"
      tasks:
        - task_key: create_objects
          python_wheel_task:
            package_name: collections_platform
            entry_point: bootstrap-catalog
            parameters:
              - --catalog=${var.catalog}
              # --create-catalog is NOT passed here. On a shared workspace the
              # catalog is created once by an admin (sql/00_bootstrap.sql).
              # Add it only on your own workspace, where you are that admin.

    # ---------------------------------------------------------------------
    # apply_governance: masks, row filters, grants.
    # Run AFTER the pipeline, because ALTER TABLE ... SET MASK needs the table
    # to exist. ${catalog} inside the .sql file is substituted by the runner
    # (sql_runner.py), NOT by the CLI -- bundle interpolation does not reach
    # files the YAML merely points at.
    # ---------------------------------------------------------------------
    apply_governance:
      name: "[${bundle.target}] apply_governance"
      tasks:
        - task_key: governance
          python_wheel_task:
            package_name: collections_platform
            entry_point: apply-governance
            parameters:
              - --catalog=${var.catalog}
              - --bronze-schema=${var.bronze_schema}
              - --gold-schema=${var.gold_schema}
              - --ops-schema=${var.ops_schema}
              # ${workspace.file_path} IS interpolated -- this is bundle YAML.
              - --sql-path=${workspace.file_path}/sql/uc_governance.sql

    # ---------------------------------------------------------------------
    # unit_tests: no catalog access, no real data. Runs the pytest suite on a
    # single-node cluster. This is the job your CI calls on every PR.
    # ---------------------------------------------------------------------
    unit_tests:
      name: "[${bundle.target}] unit_tests"
      tasks:
        - task_key: pytest
          libraries:
            - pypi:
                package: pytest>=8.0
            - pypi:
                package: chispa>=0.10
          python_wheel_task:
            package_name: collections_platform
            entry_point: run-tests
            parameters:
              - --path=${workspace.file_path}/tests
              - --markers=not smoke

    # ---------------------------------------------------------------------
    # smoke_test: runs AFTER deploy against the real catalog. It answers one
    # question -- "is the deployed thing alive and are the contracts intact?"
    # It is not a correctness suite. Keep it under ~5 minutes or people will
    # start skipping it.
    # ---------------------------------------------------------------------
    smoke_test:
      name: "[${bundle.target}] smoke_test"
      tasks:
        - task_key: smoke
          python_wheel_task:
            package_name: collections_platform
            entry_point: run-smoke
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${var.gold_schema}
              - --max-staleness-hours=26

    # ---------------------------------------------------------------------
    # seed_synthetic: generates the pathological dataset into the landing
    # volume. Run once on dev before anything else.
    # ---------------------------------------------------------------------
    seed_synthetic:
      name: "[${bundle.target}] seed_synthetic"
      tasks:
        - task_key: seed
          python_wheel_task:
            package_name: collections_platform
            entry_point: seed-synthetic
            parameters:
              - --landing-path=${var.landing_path}
              - --n-cases=200000
              - --skew-factor=0.4     # 40% of payments land on one portfolio
