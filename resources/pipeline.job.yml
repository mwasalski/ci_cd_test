resources:
  jobs:
    collections_pipeline:
      name: "[${bundle.target}] collections_pipeline"

      # ---------------------------------------------------------------------
      # Serverless: one environment, shared by every task.
      #
      # This block replaces `job_clusters` + per-task `libraries`. On serverless
      # a python_wheel_task MUST reference an environment_key, and the `libraries`
      # field is ignored -- dependencies come from the environment spec instead.
      # That is the single most common reason a wheel task "deploys fine and then
      # cannot import the package".
      #
      # No spark_conf: AQE and its skew-join handling are always on and not
      # configurable here, which removes the "someone flipped a workspace default"
      # failure mode along with the knob.
      # ---------------------------------------------------------------------
      environments:
        - environment_key: default
          spec:
            environment_version: ${var.environment_version}
            dependencies:
              # Built by `artifacts:` in databricks.yml and rewritten by the CLI
              # to the uploaded workspace path at deploy time.
              - ../dist/*.whl

      tasks:
        - task_key: ingest_cases
          environment_key: default
          python_wheel_task:
            package_name: collections_platform
            entry_point: ingest-portfolio
            parameters:
              - --catalog=${var.catalog}
              # Conformed cases land in SILVER: typed, deduplicated, DQ-checked,
              # PII-policy applied. Bronze is the landing volume itself.
              - --schema=${var.silver_schema}
              - --ops-schema=${var.ops_schema}
              # The cases directory, not the volume root: one reader, one
              # contract. Pointed at the root it would also read the payment
              # files and fail the drift check on a header that was never meant
              # to match.
              - --landing-path=${var.landing_path}/cases
              - --pii-scope=${var.pii_secret_scope}

        - task_key: ingest_payments
          # Independent of the case feed -- no reason to serialise two readers.
          environment_key: default
          python_wheel_task:
            package_name: collections_platform
            entry_point: ingest-payments
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.silver_schema}
              - --ops-schema=${var.ops_schema}
              - --landing-path=${var.landing_path}/payments

        - task_key: build_investing
          depends_on:
            - { task_key: ingest_cases }
            - { task_key: ingest_payments }
          environment_key: default
          python_wheel_task:
            package_name: collections_platform
            entry_point: build-investing
            parameters:
              - --catalog=${var.catalog}
              - --source-schema=${var.silver_schema}
              - --target-schema=${var.gold_schema}

        - task_key: build_servicing
          # Deliberately NOT depending on build_investing: two independent fact
          # domains, so they run in parallel. If someone later chains them,
          # that's a modelling smell worth catching in review.
          depends_on:
            - { task_key: ingest_cases }
            - { task_key: ingest_payments }
          environment_key: default
          python_wheel_task:
            package_name: collections_platform
            entry_point: build-servicing
            parameters:
              - --catalog=${var.catalog}
              - --source-schema=${var.silver_schema}
              - --target-schema=${var.gold_schema}

        - task_key: build_features
          depends_on:
            - { task_key: build_investing }
            - { task_key: build_servicing }
          environment_key: default
          python_wheel_task:
            package_name: collections_platform
            entry_point: build-features
            parameters:
              - --catalog=${var.catalog}
              - --source-schema=${var.silver_schema}
              - --target-schema=${var.gold_schema}
              # as-of date is a parameter, never "today()" inside the code:
              # that is what makes a backfill reproducible.
              - --as-of-date={{job.parameters.as_of_date}}

      parameters:
        - name: as_of_date
          default: "{{job.start_time.iso_date}}"

      email_notifications:
        on_failure:
          - m.wasalski@gmail.com

      queue:
        enabled: true # avoids concurrent-run failures when a backfill overlaps a schedule
