# This is a Declarative Automation Bundle definition for manual_collection_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: manual_collection_platform
  uuid: 71009260-e715-4e68-8499-6765adaef368

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2b69cffc-7563.cloud.databricks.com
    variables:
      catalog: manual_collections
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-2b69cffc-7563.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/moustache.data@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/moustache.data@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: manual_collections
      schema: prod
    permissions:
      - user_name: moustache.data@gmail.com
        level: CAN_MANAGE
